function vSynCards(){return `<p class="mu">Синоніми не завжди взаємозамінні. Читайте примітки: вони пояснюють, де слово доречне. Натисніть 🔊 для британської вимови.</p>`+SYN.map(g=>`<div class="card"><h3>${g[0]} <small>${g[1]}</small></h3><p class="mu">${g[2]}</p>${g[3].map(r=>{const[w,ex,n]=r.split("|");return `<div class="row">${spk(w)}<div><b>${w}</b>: ${E(ex)}<div class="mu">${n}</div></div>${spk(ex)}</div>`}).join("")}</div>`).join("")}
function vPat(){return `<p class="mu">Прийменник підкреслено. Червоним показано типову помилку.</p>`+PAT.map(g=>`<h2>${g[0]}</h2>`+g[1].map(r=>{const[p,uk,ex,why,bad]=r.split("|");return `<div class="card"><h3>${p} <small>${uk}</small></h3><div class="row" style="border:0">${spk(ex.replace(/\*/g,""))}<div>${hl(ex)}<div class="mu">Чому: ${why}</div><div class="bad">✗ ${bad}</div></div></div></div>`}).join("")).join("")}
function vCol(){return `<p class="mu">Англійська любить певні пари слів. Вчіть їх разом.</p>`+COL.map(([r])=>{const[c,uk,ex,bad]=r.split("|");return `<div class="card"><h3>${c} <small>${uk}</small></h3><div class="row" style="border:0">${spk(ex)}<div>${E(ex)}<div class="bad">✗ ${bad} → <span class="good">✓ ${c}</span></div></div></div></div>`}).join("")}
function mcq(k,Q){return Q.map((q,i)=>{const a=A[k][i],d=a!=null;return `<div class="card"><div>${k=="e1"?hl(q[0],"mark"):E(q[0])}</div><div class="opts">${ord(q[1],i).map(([o,j])=>`<button class="opt ${d?(j==q[2]?"ok":j==a?"no":""):""}" ${d?"disabled":""} onclick="pick('${k}',${i},${j})">${o}</button>`).join("")}</div>${d?`<div class="fb ${a==q[2]?"ok":"no"}">${a==q[2]?"✓ Correct. ":"✗ Правильна відповідь: <b>"+q[1][q[2]]+"</b>. "}${q[3]}</div>`:""}</div>`}).join("")}
function shuf(a){return a}
function pick(k,i,j){A[k][i]=j;const q=(k=="e1"?E1:E2)[i];if(j==q[2])toast(msgs[i%4]);draw()}
function vPr(){const L={e1:"1. Best synonym",e2:"2. Prepositions",e3:"3. Upgrade it",e4:"4. Fix the mistake"};let h=`<div class="sub">${Object.keys(L).map(k=>`<button class="${ps==k?"on":""}" onclick="ps='${k}';draw()">${L[k]}</button>`).join("")}</div>`;
if(ps=="e1")h+=`<p class="mu">Оберіть найкращу заміну для виділеного слова з огляду на контекст.</p>`+mcq("e1",E1);
if(ps=="e2")h+=`<p class="mu">Оберіть правильний прийменник. Останні питання перевіряють result in / from, reason for та solution to.</p>`+mcq("e2",E2);
if(ps=="e3")h+=`<p class="mu">Перепишіть речення своїми словами. Перевірка шукає цільові слова з підказки, але не оцінює граматику чи стиль. Еталон лише один із можливих варіантів.</p>`+E3.map((q,i)=>{const a=A.e3[i];return `<div class="card"><div><span class="bad">Original:</span> ${E(q[0])}</div><div class="mu">Hint: ${q[1]}</div><textarea oninput="D[${i}]=this.value" ${a?"readonly":""} placeholder="Type your upgraded sentence...">${E(a?a.t:D[i]||"")}</textarea>${a?`<div class="fb ${a.m.length>=2?"ok":"no"}">${a.m.length>=2?"✓ Використано цільові слова: ":"Знайдено цільових слів: "+a.m.length+" (потрібно 2). "}${a.m.join(", ")}<br><b>Model:</b> ${q[3]} ${spk(q[3])}<br>${q[4]}</div><button class="btn g" onclick="delete A.e3[${i}];draw()">Try again</button>`:`<button class="btn" onclick="chk3(${i})">Check</button>`}</div>`}).join("");
if(ps=="e4")h+=`<p class="mu">Крок 1: натисніть неправильне слово. Крок 2: оберіть виправлення.</p>`+E4.map((q,i)=>{const a=A.e4[i]||{w:null,f:null},tk=q[0].split(" ");return `<div class="card"><div class="opts">${tk.map((t,j)=>{const dn=e4done(i),c=dn?(j==q[1]?"ok":j==a.w?"no":""):"";return `<button class="opt ${c}" ${dn||a.w!=null?"disabled":""} onclick="w4(${i},${j})">${E(t)}</button>`}).join("")}</div>${a.w==q[1]?`<div class="mu">Виправлення:</div><div class="opts">${ord(q[2],i).map(([o,j])=>`<button class="opt ${a.f!=null?(j==q[3]?"ok":j==a.f?"no":""):""}" ${a.f!=null?"disabled":""} onclick="f4(${i},${j})">${o}</button>`).join("")}</div>`:""}${e4done(i)?`<div class="fb ${e4ok(i)?"ok":"no"}">${e4ok(i)?"✓ ":"✗ "}Правильно: <b>${q[0].split(" ").map((t,j)=>j==q[1]?q[2][q[3]]:t).join(" ")}</b> (${q[4]})</div>`:""}</div>`}).join("");
return h}
function chk3(i){const t=(D[i]||"").trim();if(wc(t)<3){toast("Спочатку напишіть речення.");return}A.e3[i]={t,m:hits(t,E3[i][2])};if(A.e3[i].m.length>=2)toast("Great upgrade!");draw()}
function w4(i,j){A.e4[i]={w:j,f:null};draw()}
function f4(i,j){A.e4[i].f=j;if(e4ok(i))toast(msgs[i%4]);draw()}
function wstats(){const n=wc(W),s=hits(W,WS),p=hits(W,WP),c=hits(W,WC);const r=[["100–130 слів",n>=100&&n<=130,n+" слів"],["5+ синонімів",s.length>=5,s.length+"/5"],["3+ конструкцій з прийменниками",p.length>=3,p.length+"/3"],["3+ collocations",c.length>=3,c.length+"/3"]];
const ch=a=>a.map(x=>`<span class="chk">${E(x)}</span>`).join("")||'<span class="mu">поки немає</span>';
return {r,html:`<div class="card">${r.map(x=>`<div class="req"><span>${x[1]?"✅":"⬜"} ${x[0]}</span><b>${x[2]}</b></div>`).join("")}<p><b>Синоніми:</b> ${ch(s)}</p><p><b>Word patterns:</b> ${ch(p)}</p><p><b>Collocations:</b> ${ch(c)}</p><p class="mu">Це автоматичний підрахунок за списком слів. Граматику та аргументацію сторінка не перевіряє.</p></div>`}}
function uw(){$("#ws").innerHTML=wstats().html}
function vWr(){return `<div class="card"><b>Writing Task 2</b><p>${TOPIC}</p></div><textarea id="wt" style="min-height:220px" oninput="W=this.value;uw()" placeholder="Write 100–130 words...">${E(W)}</textarea><div id="ws">${wstats().html}</div><button class="btn g" onclick="sam=!sam;draw()">${sam?"Hide":"Show"} sample answer</button>${sam?`<div class="card">${E(SAMPLE)} ${spk(SAMPLE)}<p class="mu">Це один із можливих прикладів. Підкреслена лексика збігається з вивченою.</p></div>`:""}`}
function vRes(){const{s,done,total}=stats(),W_=wstats(),sc=Object.values(s).reduce((a,x)=>a+x[0],0),pc=Math.round(sc/total*100);
const ex=[["Synonyms",s.e1],["Prepositions",s.e2],["Upgrade",s.e3],["Fix the mistake",s.e4]];
const wrong=[];E1.forEach((q,i)=>{if(A.e1[i]!=null&&A.e1[i]!==q[2])wrong.push(`Ex1: ${q[0].replace(/\*/g,"")} → <b>${q[1][q[2]]}</b>. ${q[3]}`)});E2.forEach((q,i)=>{if(A.e2[i]!=null&&A.e2[i]!==q[2])wrong.push(`Ex2: ${q[0]} → <b>${q[1][q[2]]}</b> (${q[3]})`)});E4.forEach((q,i)=>{if(e4done(i)&&!e4ok(i))wrong.push(`Ex4: ${q[0]} → <b>${q[4]}</b>`)});
const ok1=E1.filter((q,i)=>A.e1[i]===q[2]).map(q=>q[0].match(/\*(.+?)\*/)[1]+" → "+q[1][0]);
const pw=[...E2.filter((q,i)=>A.e2[i]!=null&&A.e2[i]!==q[2]).map(q=>q[3]),...E4.filter((q,i)=>e4done(i)&&!e4ok(i)).map(q=>q[5])];
const nc=hits(W,WC),cr=COL.map(c=>c[0].split("|")[0]).filter(c=>!nc.some(x=>c.split(" ").slice(-1)[0]&&x.includes(c.split(" ").slice(-1)[0])));
const msg=pc>=85?"Excellent! Ви готові до складніших завдань.":pc>=60?"Good progress. Повторіть помилки нижче.":"Хороший початок. Спробуйте Retry Mistakes.";
return `<div class="card"><h2>${pc}% — ${msg}</h2><p class="mu">Виконано ${done} із ${total} завдань. Exercise 3 зараховується, якщо знайдено 2+ цільових слова (граматика не перевіряється).</p>${ex.map(x=>`<div class="req"><span>${x[0]}</span><b>${x[1][0]}/${x[1][1]}</b></div>`).join("")}</div>
<div class="card"><h3>Помилки</h3>${wrong.length?wrong.map(x=>`<p>✗ ${x}</p>`).join(""):'<p class="good">Помилок немає.</p>'}</div>
<div class="card"><h3>Засвоєні синоніми</h3>${ok1.length?ok1.map(x=>`<span class="chk">${E(x)}</span>`).join(""):'<span class="mu">Поки що немає. Виконайте Exercise 1.</span>'}</div>
<div class="card"><h3>Прийменники для тренування</h3>${pw.length?[...new Set(pw)].map(x=>`<span class="chk">${x}</span>`).join(""):'<span class="mu">Слабких місць не виявлено.</span>'}</div>
<div class="card"><h3>Collocations для повторення</h3>${W.trim()?`<p class="mu">Ви використали: ${nc.join(", ")||"жодної"}. Спробуйте також:</p>`:'<p class="mu">Напишіть Writing Challenge, щоб побачити, які ви вже використовуєте.</p>'}${cr.slice(0,6).map(x=>`<span class="chk">${x}</span>`).join("")}</div>
<div class="card"><h3>Writing Challenge</h3>${W_.r.map(x=>`<div class="req"><span>${x[1]?"✅":"⬜"} ${x[0]}</span><b>${x[2]}</b></div>`).join("")}</div>
<button class="btn" onclick="retry()">Retry Mistakes</button><button class="btn g" onclick="if(confirm('Start again? Усі відповіді буде видалено.')){reset();draw()}">Start Again</button>`}
function retry(){E1.forEach((q,i)=>{if(A.e1[i]!==q[2])delete A.e1[i]});E2.forEach((q,i)=>{if(A.e2[i]!==q[2])delete A.e2[i]});E4.forEach((q,i)=>{if(!e4ok(i))delete A.e4[i]});E3.forEach((q,i)=>{if(!e3ok(i))delete A.e3[i]});fin=false;tab="pr";draw()}
speechSynthesis&&speechSynthesis.getVoices();draw();
</script></body></html>
